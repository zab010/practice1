<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로또 6/45 추첨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root {
    --bg: #eef1f6;
    --panel: #ffffff;
    --ink: #1b2130;
    --muted: #5c6578;
    --line: #d7dce6;
    --accent: #2a4bd7;
    --accent-ink: #ffffff;
    --slot: #e3e7ef;
    --b-yellow: #fbc400;
    --b-blue: #69c8f2;
    --b-red: #ff7272;
    --b-gray: #aaaaaa;
    --b-green: #b0d840;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #11141b;
      --panel: #1a1f2a;
      --ink: #e8ebf2;
      --muted: #97a0b3;
      --line: #2b3242;
      --accent: #6d88ff;
      --accent-ink: #0d1020;
      --slot: #242a38;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #11141b;
    --panel: #1a1f2a;
    --ink: #e8ebf2;
    --muted: #97a0b3;
    --line: #2b3242;
    --accent: #6d88ff;
    --accent-ink: #0d1020;
    --slot: #242a38;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 40px 16px 56px;
  }
  .wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

  header { display: flex; flex-direction: column; gap: 6px; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  h1 {
    margin: 0;
    font-family: "Black Han Sans", "Noto Sans KR", sans-serif;
    font-weight: 400;
    font-size: clamp(34px, 8vw, 48px);
    line-height: 1.1;
    text-wrap: balance;
  }
  header p { margin: 0; color: var(--muted); max-width: 52ch; }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .field { display: flex; align-items: center; gap: 10px; }
  .field label { font-weight: 500; font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    min-width: 34px; text-align: center; padding: 4px 10px; border-radius: 999px;
    cursor: pointer; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500;
  }
  .seg input:checked + label { background: var(--ink); color: var(--bg); }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

  .draw {
    margin-left: auto;
    font: inherit; font-weight: 700; font-size: 16px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 999px;
    padding: 12px 26px; cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .draw:hover { filter: brightness(1.08); }
  .draw:active { transform: scale(.97); }
  .draw:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .draw:disabled { opacity: .6; cursor: default; }

  .slip { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .game {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .game-tag {
    font-family: "Black Han Sans", sans-serif; font-size: 22px; width: 22px; text-align: center; color: var(--muted);
    flex: none;
  }
  .balls { display: flex; flex-wrap: wrap; gap: 8px; }

  .ball {
    --size: 44px;
    width: var(--size); height: var(--size); border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 900; font-size: 17px; color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%), var(--c);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.18);
  }
  .ball.empty { background: var(--slot); box-shadow: none; color: transparent; text-shadow: none; }
  .ball.pop { animation: pop .38s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(.3) rotate(-90deg); } to { transform: scale(1) rotate(0); } }

  .c1 { --c: var(--b-yellow); } .c2 { --c: var(--b-blue); } .c3 { --c: var(--b-red); }
  .c4 { --c: var(--b-gray); } .c5 { --c: var(--b-green); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); display: inline-block; }

  section h2 { font-size: 14px; font-weight: 700; margin: 0 0 10px; letter-spacing: .02em; }
  .history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .history li {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    padding: 10px 0; border-top: 1px solid var(--line);
  }
  .history time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; width: 64px; flex: none; }
  .history .balls { gap: 5px; }
  .history .ball { --size: 28px; font-size: 12px; font-weight: 700; }
  .history .empty-note { color: var(--muted); font-size: 14px; }

  .note { font-size: 13px; color: var(--muted); margin: 0; }

  /* 최근 당첨 결과 */
  .results-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 10px; }
  .results-head h2 { margin: 0; }
  .results-meta { font-size: 12px; color: var(--muted); }
  .draws { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .draw-card {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  }
  .draw-card.latest { border-color: var(--accent); }
  .draw-id { display: flex; flex-direction: column; line-height: 1.25; min-width: 76px; }
  .draw-id strong { font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
  .draw-id time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .draw-card .ball { --size: 36px; font-size: 14px; }
  .plus { color: var(--muted); font-weight: 700; align-self: center; padding: 0 2px; }
  .prize { grid-column: 2; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .prize b { color: var(--ink); font-weight: 700; }

  /* 내 번호 vs 최근 회차 */
  .game { flex-wrap: wrap; }
  .game .ball.miss { opacity: .35; }
  .rank {
    margin-left: auto; font-size: 12px; font-weight: 700; white-space: nowrap;
    padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }
  .rank.win { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  @media (max-width: 480px) {
    .ball { --size: 38px; font-size: 15px; }
    .game { gap: 10px; padding: 12px; }
    .draw { margin-left: 0; width: 100%; }
    .draw-card { grid-template-columns: 1fr; }
    .draw-id { flex-direction: row; align-items: baseline; gap: 8px; }
    .prize { grid-column: 1; }
    .draw-card .ball { --size: 32px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ball.pop { animation: none; }
    .draw { transition: none; }
  }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Lotto 6/45</span>
    <h1>로또 번호 추첨기</h1>
    <p>1부터 45까지 중 중복 없이 6개를 뽑아 오름차순으로 보여줍니다. 뽑은 번호는 가장 최근 회차 당첨번호와 비교해 등수를 알려줍니다.</p>
  </header>

  <section aria-labelledby="results-title">
    <div class="results-head">
      <h2 id="results-title">최근 당첨 결과</h2>
      <span class="results-meta" id="results-meta"></span>
    </div>
    <ol class="draws" id="draws"></ol>
  </section>

  <div class="controls">
    <div class="field">
      <label id="games-label">게임 수</label>
      <div class="seg" role="radiogroup" aria-labelledby="games-label">
        <input type="radio" name="games" id="g1" value="1"><label for="g1">1</label>
        <input type="radio" name="games" id="g2" value="2"><label for="g2">2</label>
        <input type="radio" name="games" id="g3" value="3"><label for="g3">3</label>
        <input type="radio" name="games" id="g4" value="4"><label for="g4">4</label>
        <input type="radio" name="games" id="g5" value="5" checked><label for="g5">5</label>
      </div>
    </div>
    <button class="draw" id="draw" type="button">번호 추첨</button>
  </div>

  <ol class="slip" id="slip" aria-live="polite"></ol>

  <div class="legend" aria-label="공 색상 구간">
    <span class="c1"><i></i>1–10</span>
    <span class="c2"><i></i>11–20</span>
    <span class="c3"><i></i>21–30</span>
    <span class="c4"><i></i>31–40</span>
    <span class="c5"><i></i>41–45</span>
  </div>

  <section>
    <h2>최근 추첨 기록</h2>
    <ul class="history" id="history"></ul>
  </section>

  <p class="note">번호는 브라우저의 암호학적 난수(crypto.getRandomValues)로 뽑습니다. 당첨 확률을 높여 주지는 않습니다. 1등 확률은 8,145,060분의 1입니다.</p>
</div>

<script>
(() => {
  const TAGS = ["A", "B", "C", "D", "E"];
  const HISTORY_KEY = "lotto645-history";
  const MAX_HISTORY = 10;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 최근 당첨 결과. scripts/update_results.py가 매주 이 부분을 갱신합니다.
  /* RESULTS:START */
  const RESULTS = {"updatedAt": "2026-09-26T07:13:25+00:00", "source": "https://www.redinfo.co.kr/lotto/s/result", "draws": [{"round": 1242, "date": "2026-09-19", "numbers": [2, 4, 10, 16, 31, 41], "bonus": 9, "firstPrize": 3281029250, "firstWinners": 9}, {"round": 1241, "date": "2026-09-12", "numbers": [7, 13, 16, 23, 24, 43], "bonus": 9, "firstPrize": 1628391980, "firstWinners": 18}, {"round": 1240, "date": "2026-09-05", "numbers": [11, 13, 19, 20, 31, 44], "bonus": 27, "firstPrize": 1791817758, "firstWinners": 16}]};
  /* RESULTS:END */

  const RANKS = { 6: "1등", 5: "3등", 4: "4등", 3: "5등" };

  const slip = document.getElementById("slip");
  const drawsEl = document.getElementById("draws");
  const resultsMeta = document.getElementById("results-meta");
  const results = RESULTS;
  const historyEl = document.getElementById("history");
  const drawBtn = document.getElementById("draw");

  function randInt(n) {
    // unbiased integer in [0, n)
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / n) * n;
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % n;
  }

  function pickSix() {
    const pool = Array.from({ length: 45 }, (_, i) => i + 1);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, 6).sort((a, b) => a - b);
  }

  const colorClass = n => "c" + Math.min(5, Math.ceil(n / 10));

  function ball(n, extra = "") {
    const el = document.createElement("span");
    el.className = `ball ${colorClass(n)} ${extra}`.trim();
    el.textContent = n;
    return el;
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
  }
  function saveHistory(h) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch {}
  }

  function renderHistory(h) {
    historyEl.replaceChildren();
    if (!h.length) {
      const li = document.createElement("li");
      li.innerHTML = '<span class="empty-note">아직 기록이 없습니다.</span>';
      historyEl.append(li);
      return;
    }
    for (const entry of h) {
      const li = document.createElement("li");
      const t = document.createElement("time");
      const d = new Date(entry.at);
      t.dateTime = d.toISOString();
      t.textContent = d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
      li.append(t);
      entry.games.forEach(g => {
        const row = document.createElement("span");
        row.className = "balls";
        g.forEach(n => row.append(ball(n)));
        li.append(row);
      });
      historyEl.append(li);
    }
  }

  const won = n => n.toLocaleString("ko-KR");
  const latestDraw = () => (results.draws && results.draws[0]) || null;

  function renderDraws() {
    drawsEl.replaceChildren();
    const draws = results.draws || [];
    draws.forEach((d, i) => {
      const li = document.createElement("li");
      li.className = "draw-card" + (i === 0 ? " latest" : "");

      const id = document.createElement("div");
      id.className = "draw-id";
      id.innerHTML = `<strong>${d.round}회</strong><time datetime="${d.date}">${d.date.replaceAll("-", ".")}</time>`;

      const row = document.createElement("span");
      row.className = "balls";
      row.setAttribute("aria-label", `${d.round}회 당첨번호 ${d.numbers.join(", ")}, 보너스 ${d.bonus}`);
      d.numbers.forEach(n => row.append(ball(n)));
      const plus = document.createElement("span");
      plus.className = "plus";
      plus.textContent = "+";
      row.append(plus, ball(d.bonus));

      li.append(id, row);
      if (d.firstPrize) {
        const prize = document.createElement("p");
        prize.className = "prize";
        prize.style.margin = "0";
        prize.innerHTML = `1등 <b>${won(d.firstPrize)}원</b> · ${won(d.firstWinners)}명`;
        li.append(prize);
      }
      drawsEl.append(li);
    });

    const latest = latestDraw();
    resultsMeta.textContent = latest
      ? `내 번호는 ${latest.round}회와 비교합니다`
      : "당첨 결과를 불러오지 못했습니다";
  }

  function rankOf(nums, d) {
    const hits = nums.filter(n => d.numbers.includes(n)).length;
    if (hits === 5 && nums.includes(d.bonus)) return { hits, label: "2등", second: true };
    return { hits, label: RANKS[hits] || "낙첨" };
  }

  function markSlip() {
    const d = latestDraw();
    slip.querySelectorAll(".game").forEach(li => {
      li.querySelector(".rank")?.remove();
      if (!d) return;
      const nums = li.dataset.nums.split(",").map(Number);
      const r = rankOf(nums, d);
      li.querySelectorAll(".balls .ball").forEach((b, i) => {
        const n = nums[i];
        const hit = d.numbers.includes(n) || (r.second && n === d.bonus);
        b.classList.toggle("miss", !hit);
      });
      const chip = document.createElement("span");
      chip.className = "rank" + (r.label !== "낙첨" ? " win" : "");
      chip.textContent = `${r.label} · ${r.hits}개 일치`;
      li.append(chip);
    });
  }

  function selectedGames() {
    return Number(document.querySelector('input[name="games"]:checked').value);
  }

  function renderSlip(games, animate) {
    slip.replaceChildren();
    const cells = [];
    games.forEach((nums, gi) => {
      const li = document.createElement("li");
      li.className = "game";
      li.dataset.nums = nums.join(",");
      const tag = document.createElement("span");
      tag.className = "game-tag";
      tag.textContent = TAGS[gi];
      const row = document.createElement("span");
      row.className = "balls";
      row.setAttribute("aria-label", `${TAGS[gi]}게임: ${nums.join(", ")}`);
      nums.forEach(n => {
        const b = ball(n, animate ? "empty" : "");
        row.append(b);
        cells.push([b, n]);
      });
      li.append(tag, row);
      slip.append(li);
    });
    return cells;
  }

  function draw(animate = true) {
    const games = Array.from({ length: selectedGames() }, pickSix);
    const useAnim = animate && !reduced;
    const cells = renderSlip(games, useAnim);

    const h = [{ at: Date.now(), games }, ...loadHistory()].slice(0, MAX_HISTORY);
    saveHistory(h);

    if (!useAnim) { renderHistory(h); markSlip(); return; }

    drawBtn.disabled = true;
    const step = Math.max(45, 360 / games.length);
    cells.forEach(([b], i) => {
      setTimeout(() => {
        b.classList.remove("empty");
        b.classList.add("pop");
        if (i === cells.length - 1) {
          drawBtn.disabled = false;
          renderHistory(h);
          markSlip();
        }
      }, i * step);
    });
  }

  drawBtn.addEventListener("click", () => draw(true));

  // Open with a ready slip so the page shows what it does.
  renderDraws();
  const existing = loadHistory();
  if (existing.length) {
    renderSlip(existing[0].games, false);
    renderHistory(existing);
    markSlip();
  } else {
    draw(false);
  }
})();
</script>
</html>
