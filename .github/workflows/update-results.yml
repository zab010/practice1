name: 로또 당첨 결과 갱신

on:
  schedule:
    # 추첨은 매주 토요일 20:35 KST. 결과 반영이 늦을 때를 대비해 두 번 실행합니다.
    - cron: "0 13 * * 6"   # 토 22:00 KST
    - cron: "0 0 * * 0"    # 일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_results.py
      - name: 변경 사항 커밋
        run: |
          if git diff --quiet -- results.json; then
            echo "새 회차 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json index.html
          git commit -m "Update lotto results ($(python -c 'import json;print(json.load(open("results.json"))["draws"][0]["round"])')회)"
          git push
